name: sync-docs

on:
  schedule:
    - cron: "52 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- generated: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- generated: " "$f"; then
            sed -i "s|^<!-- generated: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "dave-jhq1900r0"
          git config user.email "279224598+dave-jhq1900r0@users.noreply.github.com"
          set -- "chore: refresh metadata" "docs: keep current" "docs: refresh timestamp" "chore: periodic update" "chore: scheduled refresh"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
